
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video hướng dẫn riêng tư</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 30px 16px;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #252b3a;
    }

    .container {
      max-width: 850px;
      margin: 40px auto;
      padding: 28px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px #0000000d;
    }

    h1 { text-align: center; }

    .notice {
      padding: 14px;
      background: #eef4ff;
      border-radius: 10px;
      line-height: 1.6;
    }

    .video {
      margin-top: 22px;
      overflow: hidden;
      border-radius: 12px;
      background: #111;
    }

    iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
    }

    footer {
      margin-top: 20px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Video hướng dẫn</h1>

    <p class="notice">
      🔒 Video dành cho những người được cấp quyền.
      Hãy đăng nhập tài khoản Google đã được cho phép
      để xem nội dung.
    </p>

    <div class="video">
      <iframe
        src="https://drive.google.com/file/d/https://drive.google.com/file/d/1c-tG7u2qo2eR2tefAoCwB3nOHvWnuAE4/view?usp=sharing/preview"
        allow="autoplay; fullscreen"
        allowfullscreen>
      </iframe>
    </div>

    <footer>© Video hướng dẫn của tôi</footer>
  </main>
</body>
</html>
